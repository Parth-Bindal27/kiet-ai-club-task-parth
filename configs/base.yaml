experiment:
  name: "base"
  seed: 42
  generations: 1
  output_dir: "results"
  log_dir: "logs"
  curriculum_mixing: true

model:
  name: "facebook/opt-125m"
  use_lora: false
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05

training:
  learning_rate: 5e-5
  batch_size: 4
  gradient_accumulation_steps: 2
  num_epochs: 1
  warmup_ratio: 0.0
  max_seq_length: 256
  fp16: false
  weight_decay: 0.01

generation:
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 32
  repetition_penalty: 1.2
  num_samples: 5
  batch_size: 4
  seed: 42
  prompt_template: "alpaca"

data:
  dataset_name: "databricks/databricks-dolly-15k"
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  synthetic_ratio: 1.0
  max_train_samples: 5
  data_dir: "data"

filtering:
  enabled: true
  deduplication: true
  dedup_method: "normalized"
  quality_filter: true
  min_quality_score: 4.0
  min_length: 5
  max_length: 2048
  max_repetition_ratio: 0.6
  entropy_filter: true

evaluation:
  metrics:
    - "perplexity"
    - "rouge"
    - "diversity"
    - "distribution_shift"
    - "duplication"
    - "rare_features"
  batch_size: 4
  max_eval_samples: 5
